name: Quality Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flowstate
          POSTGRES_PASSWORD: flowstate
          POSTGRES_DB: flowstate
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flowstate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flowstate:flowstate@localhost:5432/flowstate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Docker build
        run: docker build -t flowstate:ci .
